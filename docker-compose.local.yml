version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: umi-mongo-local
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umi-api-local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - USE_GPU_PROXY=false
      - LANGCHAIN_TRACING_V2=false
      - LANGSMITH_TRACING=false
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

volumes:
  mongo_data:
